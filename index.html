<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>New Year Countdown</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="container">

    <h1>
      New Year Countdown 🎉
    </h1>

    <p class="subtitle">
      Counting down to January 1, 2027
    </p>


    <div class="countdown">

      <div class="time-box">
        <span
          class="number"
          id="days"
        >0</span>

        <span class="label">
          Days
        </span>
      </div>


      <div class="time-box">

        <span
          class="number"
          id="hours"
        >0</span>

        <span class="label">
          Hours
        </span>

      </div>


      <div class="time-box">

        <span
          class="number"
          id="minutes"
        >0</span>

        <span class="label">
          Minutes
        </span>

      </div>


      <div class="time-box">

        <span
          class="number"
          id="seconds"
        >0</span>

        <span class="label">
          Seconds
        </span>

      </div>

    </div>


    <button onclick="openSlideshow()">
      📸 Start Slideshow
    </button>

  </main>


  <!-- ==================================
       SLIDESHOW
       ================================== -->

  <div
    class="slideshow"
    id="slideshow"
  >

    <button
      class="close"
      onclick="closeSlideshow()"
      aria-label="Close slideshow"
    >
      ×
    </button>


    <button
      class="arrow prev"
      onclick="previousPhoto()"
      aria-label="Previous photo"
    >
      ❮
    </button>


    <img
      id="slideImage"
      src=""
      alt="Slideshow photo"
    >


    <button
      class="arrow next"
      onclick="nextPhoto()"
      aria-label="Next photo"
    >
      ❯
    </button>


    <div id="counter">
      0 / 0
    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
