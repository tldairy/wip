<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title> Cao Đao </title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <!-- ==================================
       PASSWORD GATE
       ================================== -->

  <div
    class="password-gate"
    id="passwordGate"
  >
    <div class="password-modal">
      <h2>🔐 Nhập Mật Khẩu</h2>
      <form onsubmit="submitPassword(event)">
        <input
          type="password"
          id="passwordInput"
          placeholder="Nhập mật khẩu..."
          required
        >
        <button type="submit">
          Vào
        </button>
      </form>
      <p id="errorMessage" class="error-message"></p>
    </div>
  </div>

  <main class="container">

    <h1>
       "Cao Đao"
    </h1>

    <p class="subtitle">
      ⛰️ Đếm ngược đến ngày đi Sa Pa ⛰️
    </p>

    <p class="subtitle">
      Thời gian trôi nhanh lắm, nhớ mang theo áo ấm và đồ ăn nha ❤️
    </p>


    <div class="countdown">

      <div class="time-box">
        <span
          class="number"
          id="days"
        >0</span>

        <span class="label">
          Ngày
        </span>
      </div>


      <div class="time-box">

        <span
          class="number"
          id="hours"
        >0</span>

        <span class="label">
          Tiếng
        </span>

      </div>


      <div class="time-box">

        <span
          class="number"
          id="minutes"
        >0</span>

        <span class="label">
          Phút
        </span>

      </div>


      <div class="time-box">

        <span
          class="number"
          id="seconds"
        >0</span>

        <span class="label">
          Giây
        </span>

      </div>

    </div>

    <div style="text-align: center; margin-top: 20px; column-gap: 40px; display: flex; justify-content: center; flex-wrap: wrap; row-gap: 40px;">
      <button onclick="openSlideshow()">
        📸 Ảnh Mình Nè
      </button>

      <button onclick="window.location.href='calendar.html?date=2026-12-31'">
        🏔️ Lịch Đi Chơi Sa Pa 
      </button>

      <button onclick="window.location.href='sapa-map.html'">
        🗺️ Bản Đồ
      </button>

      <button onclick="window.location.href='reasons.html'">
        ❤️ 100 Lý Do Anh Yêu Em 
      </button>

      <button onclick="window.location.href='dish.html'">
        🍜 Hôm Nay Ăn Gì?
      </button>

      <button onclick="window.location.href='packing-list.html'">
        🎒 Checklist Đi Chơi
      </button>

    <div>


    </div>
    
  </main>


  <!-- ==================================
       SLIDESHOW
       ================================== -->

  <div
    class="slideshow"
    id="slideshow"
  >

    <button
      class="close"
      onclick="closeSlideshow()"
      aria-label="Close slideshow"
    >
      ×
    </button>


    <button
      class="arrow prev"
      onclick="previousPhoto()"
      aria-label="Previous photo"
    >
      ❮
    </button>


    <img
      id="slideImage"
      src=""
      alt="Slideshow photo"
    >


    <button
      class="arrow next"
      onclick="nextPhoto()"
      aria-label="Next photo"
    >
      ❯
    </button>


    <div id="counter">
      0 / 0
    </div>

  </div>


  <script src="script.js"></script>


</body>

</html>
