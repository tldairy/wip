<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title> Cao Đao </title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="container">

    <h1>
       "Cao Đao"
    </h1>

    <p class="subtitle">
      ⛰️ Đếm ngược đến ngày đi Sa Pa ⛰️
    </p>

    <p class="subtitle">
      Thời gian trôi nhanh lắm nha, nhớ mang theo áo ấm và đồ ăn nha ❤️
    </p>


    <div class="countdown">

      <div class="time-box">
        <span
          class="number"
          id="days"
        >0</span>

        <span class="label">
          Ngày
        </span>
      </div>


      <div class="time-box">

        <span
          class="number"
          id="hours"
        >0</span>

        <span class="label">
          Tiếng
        </span>

      </div>


      <div class="time-box">

        <span
          class="number"
          id="minutes"
        >0</span>

        <span class="label">
          Phút
        </span>

      </div>


      <div class="time-box">

        <span
          class="number"
          id="seconds"
        >0</span>

        <span class="label">
          Giây
        </span>

      </div>

    </div>


    <button onclick="openSlideshow()">
      📸 Ảnh Mình Nè ❤️
    </button>

  </main>


  <!-- ==================================
       SLIDESHOW
       ================================== -->

  <div
    class="slideshow"
    id="slideshow"
  >

    <button
      class="close"
      onclick="closeSlideshow()"
      aria-label="Close slideshow"
    >
      ×
    </button>


    <button
      class="arrow prev"
      onclick="previousPhoto()"
      aria-label="Previous photo"
    >
      ❮
    </button>


    <img
      id="slideImage"
      src=""
      alt="Slideshow photo"
    >


    <button
      class="arrow next"
      onclick="nextPhoto()"
      aria-label="Next photo"
    >
      ❯
    </button>


    <div id="counter">
      0 / 0
    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
